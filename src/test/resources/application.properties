server.port=0
# 每个 ApplicationContext 使用独立命名的内存库，配合 @DirtiesContext 实现类间数据隔离
spring.datasource.url=jdbc:h2:mem:testdb-${random.uuid};MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always
spring.jpa.open-in-view=false
logging.level.com.github.lisama569=INFO

# 测试不依赖真实定时：把到期扫描间隔调到极大，到期/生效一律由测试显式调用 sweep 驱动，
# 避免后台线程在固定时钟下引入竞态，保证离线、确定性、可重复。
release.window.sweep.fixed-delay-ms=3153600000000
release.window.sweep.initial-delay-ms=3153600000000
release.window.sweep.batch-size=100
