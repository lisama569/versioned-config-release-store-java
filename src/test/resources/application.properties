server.port=0
# 每个 ApplicationContext 使用独立命名的内存库，配合 @DirtiesContext 实现类间数据隔离
spring.datasource.url=jdbc:h2:mem:testdb-${random.uuid};MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always
spring.jpa.open-in-view=false
# 测试中关闭后台定时清扫，改为显式调用 processExpiredWindows() 保证时序确定
release.window.sweep.enabled=false
logging.level.com.github.lisama569=INFO
