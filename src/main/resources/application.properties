server.port=0

# 默认使用内嵌 H2 文件库，数据落盘以便持久化与重启验证
spring.datasource.url=jdbc:h2:file:./data/configstore;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false

# 生效时间窗到期扫描：扫描间隔与单批上限（测试环境在 test 配置中覆盖为极大间隔）
release.window.sweep.fixed-delay-ms=1000
release.window.sweep.initial-delay-ms=500
release.window.sweep.batch-size=100
